<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jogo de Nim Online</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <button id="theme-toggle" title="Alternar Tema">
        <i class="fas fa-moon"></i>
    </button>

    <div id="menu-overlay">
        <div id="main-menu" class="menu-box">
            <h2>Jogo de Nim</h2>
            <p class="menu-subtitle">Escolha seu modo de jogo:</p>
            
            <button id="start-online-btn" class="menu-btn primary">
                <i class="fas fa-globe"></i> Jogo Online
            </button>

            <button id="start-offline-btn" class="menu-btn secondary">
                <i class="fas fa-robot"></i> Contra o PC
            </button>
        </div>

        <div id="difficulty-menu" class="menu-box hidden">
            <h2>Dificuldade</h2>
            <p class="menu-subtitle">Quão esperto é o computador?</p>

            <button class="menu-btn difficulty-btn" data-level="easy" style="background-color: #2ecc71;">
                <i class="fas fa-smile"></i> Fácil
            </button>
            <button class="menu-btn difficulty-btn" data-level="medium" style="background-color: #f39c12;">
                <i class="fas fa-meh"></i> Médio
            </button>
            <button class="menu-btn difficulty-btn" data-level="hard" style="background-color: #e74c3c;">
                <i class="fas fa-dizzy"></i> Difícil
            </button>

            <button id="back-to-menu-btn" class="menu-link">Voltar</button>
        </div>
    </div>

    <div id="game-area">
        <div id="game-container" class="hidden">
            <h1>Jogo de Nim</h1>
            
            <div id="game-info">
                <h2 id="status-message">Aguardando...</h2>
            </div>
    
            <div id="game-board">
                <div id="heaps-container"></div>
            </div>
            
            <div style="height: 100px; display: block; width: 100%;"></div>
        </div>
    </div>

    <aside id="sidebar">
        <div class="sidebar-header">
            <h3><i class="fas fa-comments"></i> Chat</h3>
            <span class="online-status"><span class="dot"></span> <span id="connection-status">Offline</span></span>
        </div>

        <div id="chat-messages">
            <div class="message system">
                <span class="msg-text">Bem-vindo!</span>
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Digite..." autocomplete="off">
            <button id="send-btn"><i class="fas fa-paper-plane"></i></button>
        </div>
    </aside>

    <div id="controls">
        <button id="confirm-move-btn">Confirmar Jogada</button>
        <button id="exit-btn" class="hidden">Sair</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
